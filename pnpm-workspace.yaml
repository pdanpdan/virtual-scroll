minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - vite@8.3.0
  - '@types/node@26.6.2'
  - vike-vue@0.9.14

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - undici@6.22.0
  - undici-types@6.21.0

shellEmulator: true

packages:
  - packages/*

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild

catalogs:
  default:
    '@antfu/eslint-config': ^9.5.1
    '@playwright/test': ^1.63.0
    '@release-it/conventional-changelog': ^12.0.2
    '@tailwindcss/vite': ^4.3.3
    '@types/node': ^26.6.2
    '@vitejs/plugin-vue': ^6.0.9
    '@vitest/coverage-v8': ^5.0.1
    '@vitest/ui': ^5.0.1
    '@vue/compiler-dom': ^3.5.43
    '@vue/test-utils': ^2.5.1
    '@vue/tsconfig': ^0.9.1
    browserslist: ^4.29.0
    daisyui: ^5.7.42
    eslint: ^10.11.0
    eslint-plugin-vuejs-accessibility: ^2.6.0
    jsdom: ^30.1.0
    lightningcss: ^1.33.0
    release-it: ^21.1.0
    shiki: ^4.4.3
    tailwindcss: ^4.3.3
    typescript: ^6.0.3
    vike: ^0.4.266
    vike-vue: ^0.9.14
    vite: ^8.3.0
    vite-plugin-dts: ^5.1.0
    vitest: ^5.0.1
    vue: ^3.5.43
    vue-tsc: ^3.3.11
