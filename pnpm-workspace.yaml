shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
  - undici@6.22.0
  - undici-types@6.21.0
packages:
  - packages/*
catalogs:
  default:
    '@antfu/eslint-config': ^9.0.0
    '@release-it/conventional-changelog': ^11.0.0
    '@tailwindcss/vite': ^4.3.0
    '@types/node': ^25.7.0
    '@vitejs/plugin-vue': ^6.0.6
    '@vitest/coverage-v8': ^4.1.6
    '@vitest/ui': ^4.1.6
    '@vue/compiler-dom': ^3.5.34
    '@vue/test-utils': ^2.4.10
    '@vue/tsconfig': ^0.9.1
    browserslist: ^4.28.2
    daisyui: ^5.5.19
    eslint: ^10.3.0
    eslint-plugin-vuejs-accessibility: ^2.5.0
    jsdom: ^29.1.1
    lightningcss: ^1.32.0
    release-it: ^20.0.1
    shiki: ^4.0.2
    tailwindcss: ^4.3.0
    typescript: ^6.0.3
    vike: ^0.4.259
    vike-vue: ^0.9.11
    vite: ^8.0.12
    vite-plugin-dts: ^5.0.0
    vitest: ^4.1.6
    vue: ^3.5.34
    vue-tsc: ^3.2.8
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
