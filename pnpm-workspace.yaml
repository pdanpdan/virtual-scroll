minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@vue/language-core@3.3.14'
  - vue-tsc@3.3.14

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - undici@6.22.0
  - undici-types@6.21.0

shellEmulator: true

packages:
  - packages/*

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild

catalogs:
  default:
    '@antfu/eslint-config': ^10.0.0
    '@playwright/test': ^1.65.0
    '@release-it/conventional-changelog': ^12.0.2
    '@tailwindcss/vite': ^4.3.5
    '@types/node': ^26.6.6
    '@vitejs/plugin-vue': ^6.0.10
    '@vitest/coverage-v8': ^5.1.0
    '@vitest/ui': ^5.1.0
    '@vue/compiler-dom': ^3.5.45
    '@vue/test-utils': ^2.5.1
    '@vue/tsconfig': ^0.9.1
    browserslist: ^4.29.5
    daisyui: ^5.7.50
    eslint: ^10.14.0
    eslint-plugin-vuejs-accessibility: ^2.6.3
    jsdom: ^31.0.0
    lightningcss: ^1.33.0
    release-it: ^21.1.2
    shiki: ^4.6.0
    tailwindcss: ^4.3.5
    typescript: ^6.0.3
    vike: ^0.4.270
    vike-vue: ^0.9.16
    vite: ^8.3.6
    vite-plugin-dts: ^5.1.2
    vitest: ^5.1.0
    vue: ^3.5.45
    vue-tsc: ^3.3.14
