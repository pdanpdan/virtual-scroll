    '@vitejs/plugin-vue': ^6.0.7
    '@vitest/coverage-v8': ^4.1.10
    '@vitest/ui': ^4.1.10
    '@vue/compiler-dom': ^3.5.39
    '@vue/test-utils': ^2.4.11
    '@vue/tsconfig': ^0.9.1
    browserslist: ^4.28.5
    daisyui: ^5.6.17
    eslint: ^10.7.0
    eslint-plugin-vuejs-accessibility: ^2.5.0
    jsdom: ^29.1.1
    lightningcss: ^1.32.0
    release-it: ^20.2.1
    shiki: ^4.3.1
    tailwindcss: ^4.3.2
    typescript: ^6.0.3
    vike: ^0.4.260
    vike-vue: ^0.9.13
