minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@shikijs/core@4.5.0'
  - '@shikijs/engine-javascript@4.5.0'
  - '@shikijs/engine-oniguruma@4.5.0'
  - '@shikijs/langs@4.5.0'
  - '@shikijs/primitive@4.5.0'
  - '@shikijs/themes@4.5.0'
  - '@shikijs/types@4.5.0'
  - shiki@4.5.0
  - '@vue/language-core@3.3.14'
  - vue-tsc@3.3.14

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - undici@6.22.0
  - undici-types@6.21.0

shellEmulator: true

packages:
  - packages/*

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild

catalogs:
  default:
    '@antfu/eslint-config': ^10.0.0
    '@playwright/test': ^1.64.1
    '@release-it/conventional-changelog': ^12.0.2
    '@tailwindcss/vite': ^4.3.3
    '@types/node': ^26.6.6
    '@vitejs/plugin-vue': ^6.0.10
    '@vitest/coverage-v8': ^5.0.5
    '@vitest/ui': ^5.0.5
    '@vue/compiler-dom': ^3.5.44
    '@vue/test-utils': ^2.5.1
    '@vue/tsconfig': ^0.9.1
    browserslist: ^4.29.5
    daisyui: ^5.7.50
    eslint: ^10.13.0
    eslint-plugin-vuejs-accessibility: ^2.6.3
    jsdom: ^30.1.3
    lightningcss: ^1.33.0
    release-it: ^21.1.1
    shiki: ^4.5.0
    tailwindcss: ^4.3.3
    typescript: ^6.0.3
    vike: ^0.4.268
    vike-vue: ^0.9.16
    vite: ^8.3.5
    vite-plugin-dts: ^5.1.2
    vitest: ^5.0.5
    vue: ^3.5.44
    vue-tsc: ^3.3.14
