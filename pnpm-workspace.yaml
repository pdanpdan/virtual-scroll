minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - daisyui@5.7.36
  - vite@8.3.0

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - undici@6.22.0
  - undici-types@6.21.0

shellEmulator: true

packages:
  - packages/*

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild

catalogs:
  default:
    '@antfu/eslint-config': ^9.5.1
    '@playwright/test': ^1.63.0
    '@release-it/conventional-changelog': ^12.0.0
    '@tailwindcss/vite': ^4.3.3
    '@types/node': ^22.20.2
    '@vitejs/plugin-vue': ^6.0.8
    '@vitest/coverage-v8': ^5.0.0
    '@vitest/ui': ^5.0.0
    '@vue/compiler-dom': ^3.5.42
    '@vue/test-utils': ^2.5.0
    '@vue/tsconfig': ^0.9.1
    browserslist: ^4.28.9
    daisyui: ^5.7.36
    eslint: ^10.10.0
    eslint-plugin-vuejs-accessibility: ^2.6.0
    jsdom: ^30.0.1
    lightningcss: ^1.33.0
    release-it: ^21.0.2
    shiki: ^4.4.3
    tailwindcss: ^4.3.3
    typescript: ^6.0.3
    vike: ^0.4.266
    vike-vue: ^0.9.13
    vite: ^8.3.0
    vite-plugin-dts: ^5.1.0
    vitest: ^5.0.0
    vue: ^3.5.42
    vue-tsc: ^3.3.11
